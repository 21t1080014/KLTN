spring.application.name=shopdongho
spring.datasource.url=jdbc:mysql://localhost:3306/shopdongho
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

upload.dir=${UPLOAD_DIR:D:/uploadImgshop}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Cau hinh SMTP Gmail
# QUAN TRONG: khong hard-code password o day. Dat bien moi truong MAIL_USERNAME/MAIL_PASSWORD
# truoc khi chay app (vd: trong IDE run config, hoac file .env khong commit len git).
# App password Gmail cu da bi lo trong git history da duoc yeu cau thu hoi/tao lai.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dunghung158@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# (tuy chon) Đat ten nguoi gui
# spring.mail.properties.mail.smtp.from=your.email@gmail.com

# Bao mat session
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m
# Ngưỡng tổng chi tiêu (VNĐ) để lên hạng khách hàng (Silver là mặc định)
shop.tier.gold-min-spend=20000000
shop.tier.diamond-min-spend=100000000
# File tĩnh (css/js) luôn được trình duyệt hỏi lại server (ETag/Last-Modified) để không bị kẹt bản CSS/JS cũ sau khi cập nhật
spring.web.resources.cache.cachecontrol.no-cache=true
