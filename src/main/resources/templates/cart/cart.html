<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/storefront :: head('Giỏ hàng')}"></head>
<body>
	<div th:replace="~{layout/storefront :: navbar}"></div>
	<!-- cart/cart.html -->
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-10">
		<nav class="text-sm text-charcoal-muted mb-6">
			<a href="/" class="hover:text-charcoal">Trang chủ</a> / <span class="text-charcoal">Giỏ hàng</span>
		</nav>

		<div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
			<!-- Danh sách sản phẩm -->
			<div class="lg:col-span-2" id="cart-items">
				<h4 class="font-heading text-xl text-charcoal mb-6">Giỏ hàng</h4>
				<!-- Các sản phẩm sẽ được render bằng JS -->
			</div>

			<!-- Thông tin đơn hàng -->
			<div class="lg:col-span-1">
				<div class="border border-line p-6">
					<h5 class="font-heading text-lg text-charcoal mb-4">Thông tin đơn hàng</h5>
					<p class="text-sm text-charcoal-soft mb-3">
						<strong class="text-charcoal">Tổng tiền:</strong>
						<span id="cart-total" class="price-current">0 ₫</span>
					</p>
					<p class="text-xs text-charcoal-muted mb-3">Sau khi nhận đơn hàng, chúng tôi sẽ kiểm tra tình
						trạng và xác nhận lại với quý khách. Hotline: 0974.79.2552</p>
					<p class="text-xs text-charcoal-muted">Lưu ý: Địa chỉ giao hàng chính là địa chỉ của bạn trong
						tài khoản của bạn</p>

					<a href="/checkout" class="btn-primary w-full mt-6">Thanh toán ngay</a>
					<a href="/" class="block text-center text-sm text-charcoal-muted hover:text-charcoal mt-3">↩
						Tiếp tục mua hàng</a>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{layout/storefront :: footer}"></div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="/js/cartPage.js"></script>
</body>
</html>
