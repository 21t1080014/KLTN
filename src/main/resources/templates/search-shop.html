<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Tìm kiếm - Shop đồng hồ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/shop.css">

</head>
<body>
	<div th:replace="~{layouts/navbar :: navbar}"></div>
	<div class="container py-4">
		<div class="mb-3">
			<h5 id="searchSummary" class="fw-normal text-muted"></h5>
		</div>
		<div class="row row-cols-2 row-cols-md-5 g-3" id="searchResult"></div>
		<nav>
			<ul class="pagination justify-content-center mt-4" id="pagination"></ul>
		</nav>
	</div>
	<!-- Quick View Modal -->
	<div class="modal fade" id="quickViewModal" tabindex="-1"
		aria-labelledby="quickViewLabel" aria-hidden="true">
		<div class="modal-dialog modal-xl modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-body p-4">
					<button type="button"
						class="btn-close position-absolute top-0 end-0 m-3"
						data-bs-dismiss="modal"></button>
					<div class="row">
						<!-- Ảnh -->
						<div class="col-md-6 text-center">
							<div id="qvCarousel" class="carousel slide"
								data-bs-ride="carousel">

								<!-- Indicators -->
								<div class="carousel-indicators" id="qv-indicators">
									<!-- JS sẽ render -->
								</div>

								<!-- Wrapper for slides -->
								<div class="carousel-inner" id="qv-carousel-inner">
									<!-- JS sẽ render -->
								</div>

								<!-- Controls -->
								<button class="carousel-control-prev" type="button"
									data-bs-target="#qvCarousel" data-bs-slide="prev">
									<span class="carousel-control-prev-icon"></span>
								</button>
								<button class="carousel-control-next" type="button"
									data-bs-target="#qvCarousel" data-bs-slide="next">
									<span class="carousel-control-next-icon"></span>
								</button>
							</div>
						</div>
						<!-- Thông tin -->
						<div class="col-md-6">
							<h4 id="qv-name"></h4>
							<p>
								SKU: <span id="qv-sku"></span>
							</p>
							<div
								class="d-inline-flex align-items-baseline flex-nowrap gap-2 mb-2">
								<strong id="qv-discounted" class="text-danger"></strong> <small
									id="qv-original"
									class="text-muted text-decoration-line-through"></small>
							</div>
							<!-- Thêm các thông tin khác như ngày tạo, segment, mô tả… -->
							<p id="qv-description"></p>
							<div class="mt-3">
								<button class="btn btn-outline-secondary me-2"
									onclick="decrementQty()">–</button>
								<input id="qv-qty" type="text" value="1"
									class="form-control d-inline-block text-center"
									style="width: 4rem;">
								<button class="btn btn-outline-secondary ms-2"
									onclick="incrementQty()">+</button>
							</div>
							<button id="qv-add-to-cart" class="btn btn-dark mt-3">Thêm
								vào giỏ</button>
							<div class="mt-2">
								<a id="qv-detail-link" href="#">Xem chi tiết »</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="~{fragments/cart-drawer :: cartDrawer}"></div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="/js/search-shop.js"></script>
</body>
</html>
