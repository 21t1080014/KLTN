<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
	<nav th:fragment="navbar"
		class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
		<div class="container-fluid">

			<!-- 1. Toggler (mobile) -->
			<button class="navbar-toggler me-2" type="button"
				data-bs-toggle="collapse" data-bs-target="#mainNavbar"
				aria-controls="mainNavbar" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- 2. Logo -->
			<a class="navbar-brand fw-bold" href="/">TIKTAKUS</a>

			<!-- 3. Collapse menu (menu bên trái) -->
			<div class="collapse navbar-collapse" id="mainNavbar">
				<!-- me-auto sẽ đẩy phần tử tiếp theo (icon) sang phải -->
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link active" href="/">Trang
							chủ</a></li>
					<li class="nav-item"><a class="nav-link" href="/collections">Sản
							phẩm</a></li>
				</ul>
			</div>

			<!-- 4. Icon group (luôn bên phải) -->
			<div class="d-flex align-items-center">

				<!-- Search -->
				<button id="searchToggle" class="btn btn-outline-secondary me-2">
					<i class="bi bi-search"></i>
				</button>

				<!-- Wishlist -->
				<!-- <a href="#" class="btn btn-outline-secondary position-relative me-2">
					<i class="bi bi-heart"></i> <span
					class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark text-white">0</span>
				</a> -->

				<!-- Cart -->
				<a href="#" class="btn btn-outline-secondary position-relative me-2"
					data-bs-toggle="offcanvas" data-bs-target="#cartDrawer"
					onclick="showCart()"> <i class="bi bi-cart"></i> <span
					id="cart-count"
					class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark text-white">0</span>
				</a>

				<!-- User -->
				<a href="/auth" class="btn btn-outline-dark me-2"
					th:if="${currentUser == null}"> <i class="bi bi-person"></i>
				</a>
				<div class="dropdown me-2" th:if="${currentUser != null}">
					<a class="btn btn-outline-dark dropdown-toggle" href="#"
						id="userDropdown" role="button" data-bs-toggle="dropdown"
						aria-expanded="false"> <i class="bi bi-person-circle"></i> <span
						th:text="${currentUser.fullName}">Username</span>
					</a>
					<ul class="dropdown-menu dropdown-menu-end"
						aria-labelledby="userDropdown">
						<li><a class="dropdown-item" href="/profile">Thông tin cá
								nhân</a></li>
						<li><a class="dropdown-item" href="/logout">Đăng xuất</a></li>
					</ul>
				</div>

			</div>
		</div>
		<!-- Hộp tìm kiếm -->
		<div id="searchBox" class="bg-white shadow p-3 rounded search-box"
			style="display: none;">
			<div class="text-center fw-bold mb-2">TÌM KIẾM</div>
			<form id="searchForm" action="/search-shop" method="get"
				class="d-flex position-relative">
				<input id="searchInput" class="form-control me-2" type="search"
					name="keyword" placeholder="Tìm kiếm sản phẩm...">
				<button class="btn btn-outline-secondary" type="submit">
					<i class="bi bi-search"></i>
				</button>
			</form>
			<div id="searchSuggestions"
				class="list-group position-absolute w-100 mt-1 shadow search-dropdown"
				style="display: none;"></div>
		</div>
	</nav>
</body>
</html>
