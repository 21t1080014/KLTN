<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Tìm kiếm - Shop đồng hồ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/shop.css">
<link rel="stylesheet" href="/css/detail-shop.css">
</head>
<body th:attr="data-product-id=${productId}">
	<div th:replace="~{layouts/navbar :: navbar}"></div>
	<div class="container">
		<!-- Breadcrumb -->
		<div class="breadcrumb">
			<a href="/">Trang chủ</a> / <span id="product-name">Tên sản
				phẩm</span>
			<!-- sẽ được thay đổi bằng JS -->
		</div>

		<div class="product-detail">
			<!-- Vùng ảnh -->
			<div class="images">
				<div class="thumbs-wrapper">
					<div id="thumbnail-images" class="thumbs">

						<!-- JS sẽ render <img> thumbnail tại đây -->

					</div>
				</div>

				<div class="main-image">
					<div class="image-wrapper">
						<img id="main-image" src="/img/default.png" alt="Sản phẩm">
						<div class="badge-sale">-5%</div>
					</div>
				</div>

			</div>

			<!-- Thông tin sản phẩm -->
			<div class="info">
				<h1 id="product-name-title">Tên sản phẩm</h1>

				<p>
					<strong>Thương hiệu:</strong> <span id="brand-name">Đang cập
						nhật</span>
				</p>
				<p>
					<strong>Xuất xứ:</strong> <span id="origin">Đang cập nhật</span>
				</p>
				<p>
					<strong>Bảo hành:</strong> <span id="warranty">Đang cập nhật</span>
				</p>
				<p>
					<strong>Giới tính:</strong> <span id="gender">Đang cập nhật</span>
				</p>

				<div class="prices">
					<span id="discount-price" class="price-discounted">--</span> <span
						id="original-price" class="price-original"></span>
				</div>

				<p>
					<strong>Tình trạng:</strong> <span class="in-stock">Còn hàng</span>
				</p>

				<!-- Số lượng và nút -->
				<div class="actions">
					<div class="qty">
						<button onclick="decreaseQuantity()">–</button>
						<input id="quantity" type="number" value="1" min="1">
						<button onclick="increaseQuantity()">+</button>
					</div>
					<button class="btn add-cart" id="add-to-cart-btn">Thêm vào
						giỏ</button>
					<button class="btn buy-now">Mua ngay</button>
				</div>

				<!-- Tabs -->
				<div class="tabs">
					<button class="tab active" data-tab="detail">Chi tiết sản
						phẩm</button>
				</div>


			</div>
		</div>
		<div class="tab-content" id="detail">
			<h2>Mô tả</h2>
			<p id="description">Đang tải mô tả...</p>
			<h2>Chi tiết sản phẩm</h2>
			<table id="product-detail-table" class="table-detail">
				<!-- JavaScript sẽ render nội dung bảng tại đây -->
			</table>
		</div>


	</div>
	<div th:replace="~{fragments/cart-drawer :: cartDrawer}"></div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="/js/detail-product.js"></script>
</body>
</html>
