<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/storefront :: head('Tài khoản')}"></head>
<body>
	<div th:replace="~{layout/storefront :: navbar}"></div>

	<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-10 py-10">
		<h2 class="font-heading text-2xl text-charcoal mb-8">Thông tin cá nhân</h2>

		<!-- Nav tabs -->
		<ul class="flex gap-6 border-b border-line mb-8" id="accountTabs">
			<li><a class="tab active pb-3 text-sm tracking-wide2 uppercase" id="tab-orders" href="#">Đơn hàng</a></li>
			<li><a class="tab pb-3 text-sm tracking-wide2 uppercase" id="tab-profile" href="#">Hồ sơ</a></li>
			<li><a class="tab pb-3 text-sm tracking-wide2 uppercase" id="tab-vouchers" href="#">Voucher</a></li>
		</ul>

		<!-- Sections -->
		<div id="section-orders">
			<p id="message" class="text-sm text-charcoal-muted"></p>
			<div id="order-list" class="space-y-6"></div>
			<nav>
				<ul id="pagination" class="pagination justify-center mt-8"></ul>
			</nav>
		</div>

		<div id="section-profile" style="display: none;">
			<div id="profile-content"></div>
		</div>

		<div id="section-vouchers" style="display: none;">
			<p id="voucher-message" class="text-sm text-charcoal-muted"></p>
			<div id="voucher-list" class="space-y-4"></div>
		</div>
	</div>
	<div th:replace="~{layout/cart-drawer :: cartDrawer}"></div>
	<div th:replace="~{layout/storefront :: footer}"></div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="/js/orderCustomer.js"></script>
	<script type="module" src="/js/profileCustomer.js"></script>
	<script type="module" src="/js/voucherCustomer.js"></script>
	<script>
    // Chuyển tab và show/hide section
    function activateTab(tab) {
      // 1) Đổi màu active
      $('#accountTabs .tab').removeClass('active');
      $(`#tab-${tab}`).addClass('active');
      // 2) Show/Hide các section
      $('#section-orders, #section-profile, #section-vouchers').hide();
      $(`#section-${tab}`).show();
      // 3) Gọi hàm load dữ liệu nếu cần
      if (tab === 'orders') loadOrders();
      if (tab === 'profile') loadProfile();
      if (tab === 'vouchers') loadVouchers();
    }

    $(function(){
      // Gán click cho từng tab
      $('#tab-orders').click(e => { e.preventDefault(); activateTab('orders'); });
      $('#tab-profile').click(e => { e.preventDefault(); activateTab('profile'); });
      $('#tab-vouchers').click(e => { e.preventDefault(); activateTab('vouchers'); });
      // Mặc định load đơn hàng
      activateTab('orders');
    });
  </script>
</body>
</html>
