<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/layout :: layout}">
<div th:fragment="content">
	<h1 class="mb-4 text-primary fw-bold">Quản lý Đơn Hàng</h1>

	<!-- Alert thông báo -->
	<div id="alertBox" class="alert d-none" role="alert"></div>

	<table class="table table-bordered">
		<thead>
			<tr>
				<th>ID</th>
				<th>Ngày tạo</th>
				<th>Tổng tiền</th>
				<th>Phương thức TT</th>
				<th>Trạng thái TT</th>
				<th>Email KH</th>
				<th>Hành động</th>
			</tr>
		</thead>
		<tbody id="order-table-body"></tbody>
	</table>

	<nav>
		<ul class="pagination" id="pagination"></ul>
	</nav>

	<!-- Modal cập nhật -->
	<div class="modal fade" id="updateModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Cập nhật đơn hàng</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<input type="hidden" id="updateOrderId" />
					<div class="mb-3">
						<label class="form-label">Trạng thái đơn hàng</label> <select
							id="updateOrderStatus" class="form-select">
							<option value="pending">Chờ xử lý</option>
							<option value="processing">Đang xử lý</option>
							<option value="shipping">Đang giao</option>
							<option value="completed">Hoàn thành</option>
							<option value="canceled">Đã hủy</option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label">Trạng thái thanh toán</label> <select
							id="updatePaymentStatus" class="form-select">
							<option value="unpaid">Chưa thanh toán</option>
							<option value="paid">Đã thanh toán</option>
						</select>
					</div>
				</div>
				<div class="modal-footer">
					<button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
					<button class="btn btn-primary" onclick="confirmUpdate()">Cập
						nhật</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Modal xác nhận xóa -->
	<div class="modal fade" id="deleteModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Xác nhận xóa đơn hàng</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<p>
						Bạn có chắc chắn muốn xóa đơn hàng <span id="deleteOrderIdText"></span>
						không?
					</p>
					<input type="hidden" id="deleteOrderId" />
				</div>
				<div class="modal-footer">
					<button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
					<button class="btn btn-danger" onclick="confirmDelete()">Xóa</button>
				</div>
			</div>
		</div>
	</div>
	<script>
    let currentPage = 0;
    const pageSize = 5;

    function showAlert(message, type = 'success') {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `alert alert-${type}`;
      alertBox.textContent = message;
      alertBox.classList.remove('d-none');
      setTimeout(() => alertBox.classList.add('d-none'), 3000);
    }

    function fetchOrders(page = 0) {
      fetch(`/admin/orders/api?page=${page}&size=${pageSize}`)
        .then(res => res.json())
        .then(res => {
          if (res.responseCode === 1) {
            const tbody = document.getElementById("order-table-body");
            const pagination = res.data.pagination;
            const orders = res.data.orders;

            tbody.innerHTML = "";
            orders.forEach(o => {
              tbody.innerHTML += `
                <tr>
                  <td>${o.orderId}</td>
                  <td>${o.createdAt}</td>
                  <td>${o.totalPrice.toLocaleString()}₫</td>
                  <td>${o.paymentMethod}</td>
                  <td>${o.paymentStatus}</td>
                  <td>${o.email}</td>
                  <td>
                  <button class="btn btn-sm btn-primary me-1" 
                	  onclick="openUpdateModal(${o.orderId}, '${o.paymentStatus}', '${o.orderStatus}')">
                	  Sửa
                	</button>

                    <button class="btn btn-sm btn-danger" onclick="openDeleteModal(${o.orderId})">Xóa</button>
                  </td>
                </tr>`;
            });

            // Phân trang
            const paginationContainer = document.getElementById("pagination");
            paginationContainer.innerHTML = '';
            for (let i = pagination.startPage; i <= pagination.endPage; i++) {
              paginationContainer.innerHTML += `
                <li class="page-item ${i === pagination.currentPage ? 'active' : ''}">
                  <a class="page-link" href="#" onclick="fetchOrders(${i})">${i + 1}</a>
                </li>`;
            }

            currentPage = pagination.currentPage;
          } else {
            showAlert("Không thể tải đơn hàng!", "danger");
          }
        });
    }

    function openUpdateModal(orderId, payment, status) {
      document.getElementById('updateOrderId').value = orderId;
      document.getElementById('updateOrderStatus').value = status;
      document.getElementById('updatePaymentStatus').value = payment;
      new bootstrap.Modal(document.getElementById('updateModal')).show();
    }

    function confirmUpdate() {
    	  const orderId = document.getElementById('updateOrderId').value;
    	  const paymentStatus = document.getElementById('updatePaymentStatus').value;
    	  const orderStatus = document.getElementById('updateOrderStatus').value;

    	  fetch(`/admin/orders/api/${orderId}?orderStatus=${orderStatus}&paymentStatus=${paymentStatus}`, {
    	    method: 'PUT'
    	  })
    	    .then(res => res.json())
    	    .then(res => {
    	      if (res.responseCode === 1) {
    	        showAlert("Cập nhật đơn hàng thành công!");
    	        bootstrap.Modal.getInstance(document.getElementById('updateModal')).hide();
    	        fetchOrders(currentPage);
    	      } else {
    	        showAlert("Cập nhật thất bại: " + res.responseMsg, "danger");
    	      }
    	    });
    	}


    function openDeleteModal(orderId) {
      document.getElementById('deleteOrderId').value = orderId;
      document.getElementById('deleteOrderIdText').textContent = orderId;
      new bootstrap.Modal(document.getElementById('deleteModal')).show();
    }

    function confirmDelete() {
      const orderId = document.getElementById('deleteOrderId').value;

      fetch(`/admin/orders/api/${orderId}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(res => {
          if (res.responseCode === 1) {
            showAlert("Xóa đơn hàng thành công!");
            bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
            fetchOrders(currentPage);
          } else {
            showAlert("Xóa thất bại: " + res.responseMsg, "danger");
          }
        });
    }

    document.addEventListener("DOMContentLoaded", () => fetchOrders(currentPage));
  </script>
</div>


</html>
