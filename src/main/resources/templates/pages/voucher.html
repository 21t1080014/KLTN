<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/layout :: layout}">
<div th:fragment="content" class="container py-4">
	<h1 class="mb-4 text-primary fw-bold text-center">🎟️ Quản lý
		Phiếu giảm giá</h1>

	<div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
		<div class="flex-grow-1">
			<input type="text" id="searchInput" class="form-control"
				placeholder="🔍 Tìm mã hoặc mô tả voucher...">
		</div>
		<div>
			<button onclick="loadVouchers()" class="btn btn-outline-primary">Tìm
				kiếm</button>
			<button class="btn btn-success" onclick="openCreateModal()">+
				Thêm mới</button>
		</div>
	</div>

	<!-- Danh sách Voucher -->
	<div class="table-responsive">
		<table
			class="table table-hover table-bordered align-middle shadow-sm bg-white">
			<thead class="table-light">
				<tr class="text-center">
					<th>Mã</th>
					<th>Mô tả</th>
					<th>Loại</th>
					<th>Giá trị</th>
					<th>Đơn tối thiểu</th>
					<th>Bắt đầu</th>
					<th>Kết thúc</th>
					<th>Lượt dùng</th>
					<th>Hành động</th>
				</tr>
			</thead>
			<tbody id="voucher-body"></tbody>
		</table>
	</div>

	<nav class="d-flex justify-content-center">
		<ul id="pagination" class="pagination mb-0"></ul>
	</nav>

	<!-- Modal Thêm/Sửa Voucher -->
	<div class="modal fade" id="voucherModal" tabindex="-1"
		aria-labelledby="voucherModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-scrollable">
			<div class="modal-content">
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title" id="voucherModalLabel">🎫 Thêm / Sửa
						Voucher</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<form id="voucher-form">
						<input type="hidden" id="form-mode" value="create">
						<div class="row g-3">
							<div class="col-md-6 col-lg-4">
								<label class="form-label">Mã voucher</label> <input type="text"
									id="voucherCode" class="form-control" required>
							</div>
							<div class="col-md-6 col-lg-4">
								<label class="form-label">Mô tả</label> <input type="text"
									id="description" class="form-control">
							</div>
							<div class="col-md-6 col-lg-4">
								<label class="form-label">Loại giảm giá</label> <select
									id="discountType" class="form-select">
									<option value="percent">Phần trăm</option>
									<option value="amount">Số tiền</option>
								</select>
							</div>
							<div class="col-md-6 col-lg-4">
								<label class="form-label">Giá trị giảm</label> <input
									type="number" id="discountValue" class="form-control"
									step="0.01">
							</div>
							<div class="col-md-6 col-lg-4">
								<label class="form-label">Đơn tối thiểu</label> <input
									type="number" id="minOrderAmount" class="form-control"
									step="0.01">
							</div>
							<div class="col-md-6 col-lg-4">
								<label class="form-label">Bắt đầu</label> <input type="date"
									id="startAt" class="form-control" required>
							</div>
							<div class="col-md-6 col-lg-4">
								<label class="form-label">Kết thúc</label> <input type="date"
									id="endAt" class="form-control" required>
							</div>
							<div class="col-md-6 col-lg-4">
								<label class="form-label">Lượt dùng</label> <input type="number"
									id="usageLimit" class="form-control">
							</div>
						</div>
						<div class="mt-4 text-end">
							<button id="submit-btn" type="submit" class="btn btn-primary">💾
								Lưu</button>
							<button id="cancel-btn" type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Hủy</button>

						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Modal xác nhận xóa -->
	<div class="modal fade" id="confirmDeleteModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-danger">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title">⚠️ Xác nhận xóa</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body text-center">
					Bạn có chắc chắn muốn xóa voucher <strong id="voucherToDelete"
						class="text-danger"></strong>?
				</div>
				<div class="modal-footer justify-content-center">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Hủy</button>
					<button type="button" class="btn btn-danger" id="confirmDeleteBtn">Xóa</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Scripts -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="/js/voucher.js"></script>
</div>
</html>
