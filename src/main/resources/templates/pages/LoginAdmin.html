<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập Admin</title>
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<!-- Optional: custom CSS -->
<link href="/css/common.css" rel="stylesheet">
</head>
<body class="bg-light">

	<div
		class="container d-flex justify-content-center align-items-center vh-100">
		<div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
			<h3 class="card-title text-center mb-4">Đăng nhập Admin</h3>

			<!-- Hiển thị lỗi nếu có -->
			<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

			<form th:action="@{/admin/login}" method="post">
				<div class="mb-3">
					<label for="username" class="form-label">Tên đăng nhập</label> <input
						type="text" id="username" name="username" class="form-control"
						placeholder="Nhập tên đăng nhập" required autofocus>
				</div>

				<div class="mb-3">
					<label for="password" class="form-label">Mật khẩu</label> <input
						type="password" id="password" name="password" class="form-control"
						placeholder="Nhập mật khẩu" required>
				</div>

				<button type="submit" class="btn btn-primary w-100">Đăng
					nhập</button>
			</form>

			<p class="text-center text-muted mt-3 mb-0">&copy; 2025 Shop
				Admin</p>
		</div>
	</div>

	<!-- Bootstrap JS Bundle -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
		
	</script>
</body>
</html>
