<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{layouts/layout :: layout}">
	<div th:fragment="content">
		<div class="container">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<h4>Mặt kính đồng hồ</h4>
				<button class="btn btn-primary" data-bs-toggle="modal"
					data-bs-target="#glassModal" onclick="openAddGlassModal()">Thêm mới</button>
			</div>

			<form id="searchForm" class="input-group mb-3">
				<input type="text" id="searchKeyword" class="form-control"
					placeholder="Tìm loại mặt kính..." onkeyup="searchTypes()">
				<button class="btn btn-outline-secondary" onclick="searchTypes()">Tìm</button>
			</form>

			<table class="table table-bordered">
				<thead>
					<tr>
						<th>STT</th>
						<th>Tên mặt kính</th>
						<th>Hành động</th>
					</tr>
				</thead>
				<tbody id="glassTableBody">
					<!-- Nội dung được render bằng JS -->
				</tbody>
			</table>

			<nav>
				<ul class="pagination" id="pagination">
					<!-- Phân trang render bằng JS -->
				</ul>
			</nav>
		</div>

		<!-- Modal thêm/sửa -->
		<div class="modal fade" id="glassModal" tabindex="-1"
			aria-labelledby="glassModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<form id="glassForm" >
						<div class="modal-header">
							<h5 class="modal-title" id="glassModalLabel">Thêm/Edit mặt kính đồng hồ</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
						</div>
						<div class="modal-body">
							<input type="hidden" id="glassId">
							<div class="mb-3">
								<label for="glassName" class="form-label">Tên mặt kính</label> <input
									type="text" class="form-control" id="glassName" required>
							</div>
							<div class="alert alert-danger d-none" id="glassError"></div>
						</div>
						<div class="modal-footer">
							<button type="submit" class="btn btn-success">Lưu</button>
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Hủy</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
			<div id="errorToast"
				class="toast align-items-center text-bg-danger border-0"
				role="alert" aria-live="assertive" aria-atomic="true">
				<div class="d-flex">
					<div class="toast-body"></div>
					<button type="button" class="btn-close btn-close-white me-2 m-auto"
						data-bs-dismiss="toast" aria-label="Close"></button>
				</div>
			</div>
		</div>
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
		<script src="/js/watch-glass.js"></script>
	</div>

</body>
</html>
