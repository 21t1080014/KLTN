<html xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{layouts/layout :: layout}">
	<div th:fragment="content">
		<div class="container">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<h4>Phân loại đồng hồ</h4>
				<button class="btn btn-primary" data-bs-toggle="modal"
					data-bs-target="#typeModal" onclick="openAddTypeModal()">Thêm
					mới</button>
			</div>

			<form id="searchForm" class="input-group mb-3">
				<input type="text" id="searchKeyword" class="form-control"
					placeholder="Tìm phân loại...">
				<button class="btn btn-outline-secondary" type="submit">Tìm</button>
			</form>

			<table class="table table-bordered">
				<thead>
					<tr>
						<th>STT</th>
						<th>Tên phân loại</th>
						<th>Hành động</th>
					</tr>
				</thead>
				<tbody id="typeTableBody">
					<!-- Nội dung được render bằng JS -->
				</tbody>
			</table>

			<nav>
				<ul class="pagination" id="pagination">
					<!-- Phân trang render bằng JS -->
				</ul>
			</nav>
		</div>

		<!-- Modal thêm/sửa -->
		<div class="modal fade" id="typeModal" tabindex="-1"
			aria-labelledby="typeModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<form id="typeForm">
						<div class="modal-header">
							<h5 class="modal-title" id="typeModalLabel">Thêm/Edit phân
								loại</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
						</div>
						<div class="modal-body">
							<input type="hidden" id="typeId">
							<div class="mb-3">
								<label for="typeName" class="form-label">Tên phân loại</label> <input
									type="text" class="form-control" id="typeName" required>
							</div>
							<div class="alert alert-danger d-none" id="typeError"></div>
						</div>
						<div class="modal-footer">
							<button type="submit" class="btn btn-success">Lưu</button>
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Hủy</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
			<div id="errorToast"
				class="toast align-items-center text-bg-danger border-0"
				role="alert" aria-live="assertive" aria-atomic="true">
				<div class="d-flex">
					<div class="toast-body"></div>
					<button type="button" class="btn-close btn-close-white me-2 m-auto"
						data-bs-dismiss="toast" aria-label="Close"></button>
				</div>
			</div>
		</div>
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
		<script src="/js/watch-type.js"></script>
	</div>

</body>
</html>
