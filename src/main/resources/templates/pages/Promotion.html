<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/layout :: layout}">
<div th:fragment="content">
	<h1 class="mb-4 text-primary fw-bold">Quản lý Khuyến mãi</h1>

	<form id="searchForm" class="row gy-2 gx-3 align-items-center mb-3">
		<!-- Ô tìm kiếm tên luôn hiện -->
		<div class="col-auto flex-grow-1">
			<div class="input-group">
				<input id="searchKeyword" name="keyword" type="text"
					class="form-control" placeholder="Search by name">
				<button class="btn btn-outline-secondary" type="button"
					onclick="searchPromotions()">
					<i class="bi bi-search"></i>
				</button>
			</div>
		</div>

		<!-- Nút mở Offcanvas lọc nâng cao -->
		<div class="col-auto">
			<button class="btn btn-outline-secondary" type="button"
				data-bs-toggle="offcanvas" data-bs-target="#filterDrawer"
				aria-controls="filterDrawer">
				<i class="bi bi-funnel me-1"></i> Bộ lọc
			</button>
		</div>
	</form>

	<!-- Offcanvas Bộ lọc nâng cao -->
	<div class="offcanvas offcanvas-end" tabindex="-1" id="filterDrawer"
		aria-labelledby="filterDrawerLabel">
		<div class="offcanvas-header">
			<h5 class="offcanvas-title" id="filterDrawerLabel">Bộ lọc nâng
				cao</h5>
			<button type="button" class="btn-close" data-bs-dismiss="offcanvas"
				aria-label="Close"></button>
		</div>
		<div class="offcanvas-body">
			<div class="row g-3">
				<div class="col-6">
					<label for="discountType" class="form-label">Loại giảm giá</label>
					<select id="discountType" name="discountType" form="searchForm"
						class="form-select">
						<option value="">Tất cả</option>
						<option value="percent">Phần trăm</option>
						<option value="amount">Số tiền</option>
					</select>
				</div>
				<div class="col-6">
					<label for="searchDiscount" class="form-label">Giá trị giảm</label>
					<input id="searchDiscount" name="discountValue" form="searchForm"
						type="text" class="form-control" placeholder="Search by discount">
				</div>
				<!-- Bạn có thể thêm các filter khác ở đây -->
			</div>
			<div class="mt-4 text-end">
				<button type="button" class="btn btn-primary"
					onclick="searchPromotions()">Áp dụng</button>
			</div>
		</div>
	</div>



	<!-- Danh sách khuyến mãi -->
	<div id="promotionButtons" class="mb-4">
		<!-- Nút khuyến mãi sẽ render tại đây -->
	</div>

	<!-- Responsive row with columns -->
	<div class="row align-items-center mb-3">
		<!-- Nút Thêm -->
		<div class="col-12 col-md-auto mb-2 mb-md-0">
			<button id="addPromotionBtn" class="btn btn-success w-100 w-md-auto">
				<i class="bi bi-plus-circle me-1"></i> Thêm khuyến mãi
			</button>
		</div>

		<!-- Pagination -->
		<div class="col-12 col-md">
			<nav class="d-flex justify-content-md-end justify-content-center">
				<ul id="pagination" class="pagination mb-0"></ul>
			</nav>
		</div>
	</div>

	<!-- Chi tiết Khuyến mãi & Sản phẩm -->
	<div id="promotionDetail" class="d-none mt-4">
		<div
			class="d-flex flex-wrap justify-content-between align-items-center mb-3">
			<h4 class="mb-2">
				Thông tin khuyến mãi: <span id="selectedPromotionName"></span>
			</h4>
			<div class="input-group w-100 w-md-50">
				<input type="text" id="productSearchInPromo" class="form-control"
					placeholder="Tìm sản phẩm..." aria-label="Tìm sản phẩm" />
				<button class="btn btn-outline-secondary" type="button"
					id="searchInPromoBtn">
					<i class="bi bi-search"></i>
				</button>
			</div>
		</div>
		<ul class="list-group mb-3" id="productList"></ul>
		<div class="row align-items-center mb-3">
			<!-- Nút Thêm sản phẩm -->
			<div class="col-12 col-md-auto mb-2 mb-md-0">
				<button class="btn btn-success w-100 w-md-auto"
					data-bs-toggle="modal" data-bs-target="#promotionProductModal">
					<i class="bi bi-plus-circle me-1"></i> Thêm sản phẩm
				</button>
			</div>

			<!-- Phân trang sản phẩm -->
			<div class="col-12 col-md">
				<nav class="d-flex justify-content-md-end justify-content-center">
					<ul id="productPagination" class="pagination mb-0"></ul>
				</nav>
			</div>
		</div>
	</div>

	<!-- Modal Add/Edit Promotion -->
	<div class="modal fade" id="promotionModal" tabindex="-1"
		aria-labelledby="promotionModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<form id="promotionForm">
					<div class="modal-header">
						<h5 class="modal-title" id="promotionModalLabel">Thêm / Sửa
							Khuyến mãi</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<input type="hidden" id="promotionId">
						<div class="row mb-3">
							<div class="col">
								<label class="form-label">Name</label><input type="text"
									id="name" class="form-control">
							</div>
							<div class="col">
								<label class="form-label">Discount Type</label><select
									id="discountType" class="form-select"><option
										value="percent">PERCENT</option>
									<option value="amount">AMOUNT</option></select>
							</div>
							<div class="col">
								<label class="form-label">Discount Value</label><input
									type="number" id="discountValueInput" class="form-control">
							</div>
						</div>
						<div class="row mb-3">
							<div class="col">
								<label class="form-label">Start At</label><input
									type="datetime-local" id="startAt" class="form-control">
							</div>
							<div class="col">
								<label class="form-label">End At</label><input
									type="datetime-local" id="endAt" class="form-control">
							</div>
							<div class="col">
								<label class="form-label">Description</label><input type="text"
									id="description" class="form-control">
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">Close</button>
						<button type="submit" class="btn btn-primary">Save</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Modal Add Product to Promotion -->
	<div class="modal fade" id="promotionProductModal" tabindex="-1"
		aria-labelledby="promotionProductModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-md">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="promotionProductModalLabel">Thêm
						Sản phẩm vào Khuyến mãi</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="mb-3">
						<label for="productSearch" class="form-label">Sản phẩm</label> <input
							type="text" id="productSearch" class="form-control"
							placeholder="Nhập tên sản phẩm..." autocomplete="off"> <input
							type="hidden" id="productId">
						<!-- để lưu productId thực tế -->

						<ul class="list-group position-absolute w-100 z-3"
							id="productSuggestionList"
							style="max-height: 200px; overflow-y: auto; display: none;"></ul>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Close</button>
					<button type="button" class="btn btn-success" id="addProductBtn">Add
						Product</button>
				</div>
			</div>
		</div>
	</div>
	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="deleteConfirmModal" tabindex="-1"
		aria-labelledby="deleteConfirmLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content rounded-2xl shadow-lg p-2">
				<div class="modal-header">
					<h5 class="modal-title" id="deleteConfirmLabel">Xác nhận xoá</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Close"></button>
				</div>
				<div class="modal-body">Bạn có chắc chắn muốn xoá mục này
					không? Hành động này không thể hoàn tác.</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Huỷ</button>
					<button type="button" id="confirmDeleteBtn" class="btn btn-danger">Xoá</button>
				</div>
			</div>
		</div>
	</div>

	<!-- JS dependencies -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="/js/promotion.js"></script>
</div>
</html>
