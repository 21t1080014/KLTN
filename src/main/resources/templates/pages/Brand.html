<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/layout :: layout}">
<!-- <head>
<title>Brand Page</title>
</head>
<body> -->
	<div th:fragment="content">
		<h1 class="mb-4">Quản lý Thương hiệu</h1>

		<!-- Search & Add New -->
		<div class="d-flex justify-content-between align-items-center mb-3">
			<div class="input-group w-50">
				<form id="searchForm" class="d-flex w-50">
					<input type="text" id="searchInput" class="form-control"
						placeholder="Tìm thương hiệu...">
					<button class="btn btn-outline-primary">Search</button>
				</form>
			</div>
			<button class="btn btn-success" onclick="openAddBrandModal()">+
				Add Brand</button>
		</div>

		<!-- Brand List -->
		<ul class="list-group mb-3" id="brandList">
			<!-- JavaScript sẽ render danh sách tại đây -->
		</ul>

		<!-- Pagination -->
		<nav>
			<ul class="pagination" id="pagination">
				<!-- JavaScript sẽ render phân trang -->
			</ul>
		</nav>

		<!-- Modal thêm / sửa thương hiệu -->
		<div class="modal fade" id="brandModal" tabindex="-1"
			aria-labelledby="brandModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<form id="brandForm" enctype="multipart/form-data">
						<div class="modal-header">
							<h5 class="modal-title" id="brandModalLabel">Thêm/Edit
								thương hiệu</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"
								aria-label="Close"></button>
						</div>
						<div class="modal-body px-4">
							<div class="row g-4">
								<!-- Left: Image -->
								<div class="col-md-5 border-end pe-4">
									<div class="mb-3 ">
										<label for="logoFile" class="form-label">Image<span
											class="text-danger">(*)</span>:
										</label> <input type="file" class="form-control" id="logoFile"
											name="logoFile" accept="image/*">
									</div>
									<div class="mb-3 ">
										<img id="previewImage" src="/img/default.png" alt="Preview"
											class="img-fluid rounded border" style="height: 120px;" />
									</div>
								</div>

								<!-- Right: Brand Info -->
								<div class="col-md-7 ps-4">
									<div class="mb-3 ">
										<label for="brandName" class="form-label">Brand Name<span
											class="text-danger">(*)</span>:
										</label> <input type="text" class="form-control" id="brandName"
											name="brandName"> <span id="error-name"
											class="text-danger"></span>
									</div>
									<div class="mb-3 ">
										<label for="description" class="form-label">Description:</label>
										<textarea type="text" class="form-control" id="description"
											name="description"></textarea>

									</div>
								</div>
							</div>
						</div>
						<div class="modal-footer bg-white">
							<button type="button" class="btn btn-secondary"
								data-bs-dismiss="modal">Cancel</button>
							<button type="submit" class="btn btn-success">Submit</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- Delete Confirmation Modal -->
		<div class="modal fade" id="deleteConfirmModal" tabindex="-1"
			aria-labelledby="deleteConfirmLabel" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content rounded-2xl shadow-lg p-2">
					<div class="modal-header">
						<h5 class="modal-title" id="deleteConfirmLabel">Confirm
							deletion</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body">Are you sure you want to delete the
						brand?</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">Cancel</button>
						<button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
					</div>
				</div>
			</div>
		</div>
		<div class="position-fixed top-0 end-0 p-3" style="z-index: 11">
			<div id="errorToast"
				class="toast align-items-center text-bg-danger border-0"
				role="alert" aria-live="assertive" aria-atomic="true">
				<div class="d-flex">
					<div class="toast-body"></div>
					<button type="button" class="btn-close btn-close-white me-2 m-auto"
						data-bs-dismiss="toast" aria-label="Close"></button>
				</div>
			</div>
		</div>
		<div id="imageOverlay" class="overlay" style="display: none;">
			<img id="overlayImage" src="" alt="Xem ảnh thương hiệu" />
		</div>
		<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
		<script src="/js/brand.js"></script>
	</div>
<!-- </body>-->
</html>
