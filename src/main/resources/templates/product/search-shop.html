<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/storefront :: head('Tìm kiếm')}"></head>
<body>
	<div th:replace="~{layout/storefront :: navbar}"></div>
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-12">
		<div class="mb-6">
			<h5 id="searchSummary" class="text-sm text-charcoal-muted"></h5>
		</div>
		<div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="searchResult"></div>
		<nav>
			<ul class="pagination justify-center mt-10" id="pagination"></ul>
		</nav>
	</div>

	<!-- Quick View Modal -->
	<div th:replace="~{layout/quick-view-modal :: quickViewModal}"></div>
	<div th:replace="~{layout/cart-drawer :: cartDrawer}"></div>
	<div th:replace="~{layout/storefront :: footer}"></div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="/js/search-shop.js"></script>

</html>
