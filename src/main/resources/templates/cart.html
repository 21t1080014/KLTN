<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Giỏ hàng - Shop đồng hồ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/shop.css">
</head>
<body>
	<div th:replace="~{layouts/navbar :: navbar}"></div>
	<!-- cart.html -->
	<div class="container my-4">
		<nav>
			<a href="/">Trang chủ</a> / <span>Giỏ hàng</span>
		</nav>

		<div class="row mt-3">
			<!-- Danh sách sản phẩm -->
			<div class="col-md-8" id="cart-items">
				<h4>Giỏ hàng:</h4>
				<!-- Các sản phẩm sẽ được render bằng JS -->
			</div>

			<!-- Thông tin đơn hàng -->
			<div class="col-md-4">
				<div class="border rounded p-3">
					<h5>Thông tin đơn hàng</h5>
					<p>
						<strong>Tổng tiền:</strong> <span id="cart-total"
							class="text-danger fw-bold">0 ₫</span>
					</p>
					<p class="text-muted">Sau khi nhận đơn hàng, chúng tôi sẽ kiểm
						tra tình trạng và xác nhận lại với quý khách. Hotline:
						0974.79.2552</p>
					<p>Lưu Ý:Địa chỉ giao hàng chính là địa chỉ của bạn trong tài
						khoản của bạn</p>

					<a href="/checkout" class="btn btn-dark w-100 mt-3">THANH TOÁN
						NGAY</a> <a href="/" class="d-block text-center mt-2">↩ Tiếp tục
						mua hàng</a>
				</div>
			</div>
		</div>
	</div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="/js/cartPage.js"></script>
</body>
</html>
