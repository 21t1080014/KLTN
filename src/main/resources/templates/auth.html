<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Đăng nhập / Đăng ký</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/shop.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>

	<!-- Navbar -->
	<div th:replace="~{layouts/navbar :: navbar}"></div>
	<div class="container py-4">
		<div class="auth-container">
			<!-- Nút chuyển đổi -->
			<div class="toggle-container">
				<button id="btnLogin" class="toggle-btn active"
					onclick="showLogin()">Đăng nhập</button>
				<button id="btnRegister" class="toggle-btn" onclick="showRegister()">Đăng
					ký</button>
			</div>

			<!-- Form Đăng nhập -->
			<div id="loginForm">
				<h3>Đăng nhập</h3>
				<form th:action="@{/login}" method="post">
					<div class="mb-3">
						<label for="usernameOrEmail" class="form-label">Tên đăng
							nhập hoặc Email</label> <input type="text" name="usernameOrEmail"
							id="usernameOrEmail" class="form-control" required />
					</div>
					<div class="mb-3">
						<label for="loginPassword" class="form-label">Mật khẩu</label> <input
							type="password" name="password" id="loginPassword"
							class="form-control" required />
					</div>
					<div class="d-grid">
						<button type="submit" class="btn btn-primary">Đăng nhập</button>
					</div>
				</form>
			</div>

			<!-- Form Đăng ký -->
			<div id="registerForm" style="display: none;">
				<h3>Đăng ký</h3>
				<form th:action="@{/register}" method="post"
					enctype="multipart/form-data" th:object="${user}">
					<div class="mb-3">
						<label class="form-label">Tên đăng nhập</label> <input type="text"
							th:field="*{username}" class="form-control" required />
					</div>
					<div class="mb-3">
						<label class="form-label">Email</label> <input type="email"
							th:field="*{email}" class="form-control" required />
					</div>
					<div class="mb-3">
						<label class="form-label">Họ và tên</label> <input type="text"
							th:field="*{fullName}" class="form-control" />
					</div>
					<div class="mb-3">
						<label class="form-label">Số điện thoại</label> <input type="text"
							th:field="*{phone}" class="form-control" />
					</div>
					<div class="mb-3">
						<label class="form-label">Địa chỉ</label> <input type="text"
							th:field="*{address}" class="form-control" />
					</div>
					<div class="mb-3">
						<label class="form-label">Mật khẩu</label> <input type="password"
							name="rawPassword" class="form-control" required />
					</div>
					<div class="mb-3">
						<label class="form-label">Ảnh đại diện</label> <input type="file"
							name="profileImage" class="form-control" />
					</div>
					<div class="d-grid">
						<button type="button" id="btnSubmitRegister"
							class="btn btn-success">Đăng ký</button>

					</div>
				</form>
			</div>
		</div>
	</div>
	<!-- Modal xác nhận mã (Email Verification) -->
	<div class="modal fade" id="verifyModal" tabindex="-1"
		aria-labelledby="verifyModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="verifyModalLabel">Xác nhận mã từ
						Email</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-label="Đóng"></button>
				</div>
				<div class="modal-body">
					<p>Chúng tôi đã gửi một mã 6 chữ số tới email của bạn. Vui lòng
						kiểm tra hộp thư và nhập mã bên dưới:</p>

					<!-- Chỗ hiển thị mã (nếu bạn muốn test có thể in ra, nhưng thực tế user chỉ nhận qua email) -->
					<!-- <p>Mã xác minh (test): <strong id="verifyShownCode" class="text-danger"></strong></p> -->

					<div class="mb-3">
						<input type="text" id="verifyCodeInput" class="form-control"
							placeholder="Nhập mã xác minh" maxlength="6">
						<div id="verifyFeedback" class="text-danger mt-2"
							style="display: none;"></div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-primary"
						onclick="submitVerifyCode()">Xác nhận</button>
				</div>
			</div>
		</div>
	</div>

	<div th:replace="~{fragments/cart-drawer :: cartDrawer}"></div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="/js/auth.js"></script>
</body>
</html>
