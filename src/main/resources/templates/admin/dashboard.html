<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: adminLayout}">
<div th:fragment="content">
	<h2 class="font-heading text-2xl text-charcoal mb-8">Dashboard</h2>

	<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
		<div class="border border-line bg-white p-6 text-center">
			<h5 class="text-xs tracking-wide2 uppercase text-charcoal-muted mb-2">Tổng đơn hàng</h5>
			<p id="totalOrders" class="font-heading text-2xl text-charcoal">--</p>
		</div>
		<div class="border border-line bg-white p-6 text-center">
			<h5 class="text-xs tracking-wide2 uppercase text-charcoal-muted mb-2">Doanh thu</h5>
			<p id="totalRevenue" class="font-heading text-2xl text-gold-dark">--</p>
		</div>
		<div class="border border-line bg-white p-6 text-center">
			<h5 class="text-xs tracking-wide2 uppercase text-charcoal-muted mb-2">Tồn kho</h5>
			<p id="totalInventory" class="font-heading text-2xl text-charcoal">--</p>
		</div>
	</div>

	<div class="border border-line bg-white">
		<div class="border-b border-line px-6 py-4 text-sm tracking-wide2 uppercase text-charcoal">Trạng thái đơn
			hàng</div>
		<div class="p-6">
			<ul id="orderStatusList" class="divide-y divide-line"></ul>
		</div>
	</div>

	<!-- Nhúng Axios -->
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

	<!-- Gọi API và cập nhật dữ liệu -->
	<script>
    document.addEventListener("DOMContentLoaded", function () {
      axios.get("/admin/dashboard/api")
        .then(function (response) {
          const data = response.data.data;

          document.getElementById("totalOrders").textContent = data.totalOrders;
          document.getElementById("totalRevenue").textContent = data.totalRevenue.toLocaleString("vi-VN") + " VND";
          document.getElementById("totalInventory").textContent = data.totalInventory;

          const list = document.getElementById("orderStatusList");
          list.innerHTML = "";
          for (const status in data.orderStatusCount) {
            const li = document.createElement("li");
            li.className = "flex justify-between items-center py-3 text-sm text-charcoal-soft";
            li.innerHTML = `
              <span class="capitalize">${status}</span>
              <span class="inline-flex items-center justify-center min-w-[2rem] h-7 px-2 bg-charcoal text-white text-xs rounded-full">${data.orderStatusCount[status]}</span>
            `;
            list.appendChild(li);
          }
        })
        .catch(function (error) {
          console.error("Lỗi khi gọi API:", error);
        });
    });
  </script>
</div>
</html>
