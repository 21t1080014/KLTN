<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: adminLayout}">
<div th:fragment="content">
	<h1 class="font-heading text-2xl text-charcoal mb-6">Quản lý Sản phẩm</h1>

	<!-- Search & Add -->
	<div class="d-flex justify-content-between align-items-center mb-4">
		<form id="searchForm" class="d-flex gap-2 w-50" onsubmit="event.preventDefault(); searchProducts();">
			<input type="text" id="searchInput" class="form-control" placeholder="Tìm sản phẩm...">
			<input type="number" id="minPrice" class="form-control" placeholder="Giá thấp nhất" min="0">
			<input type="number" id="maxPrice" class="form-control" placeholder="Giá cao nhất" min="0">
			<button class="btn btn-outline-primary shrink-0" type="submit">Search</button>
		</form>
		<button class="btn btn-success" onclick="openAddProductModal()">+ Add Product</button>
	</div>

	<!-- Hành động hàng loạt + CSV -->
	<div class="card mb-3">
		<div class="card-body d-flex flex-wrap gap-2 align-items-center">
			<label class="form-check-label"><input type="checkbox" id="chkAllProducts" class="form-check-input"> Chọn tất cả (trang này)</label>
			<select id="bulkStatus" class="form-select" style="width:auto"></select>
			<button class="btn btn-outline-primary btn-sm" onclick="bulkApplyStatus()">Đổi trạng thái</button>
			<select id="bulkPriceMode" class="form-select" style="width:auto">
				<option value="PERCENT">± %</option>
				<option value="AMOUNT">± số tiền</option>
				<option value="SET">Đặt giá</option>
			</select>
			<input type="number" id="bulkPriceValue" class="form-control" style="width:8rem" step="0.01" placeholder="Giá trị">
			<button class="btn btn-outline-primary btn-sm" onclick="bulkApplyPrice()">Đổi giá</button>
			<span class="flex-grow-1"></span>
			<a class="btn btn-outline-secondary btn-sm" href="/admin/products/api/export">Export CSV</a>
			<input type="file" id="importFile" accept=".csv" class="form-control" style="width:14rem">
			<button class="btn btn-outline-secondary btn-sm" onclick="importCsv()">Import CSV</button>
		</div>
	</div>

	<!-- Product List -->
	<ul class="list-group mb-3" id="productList">
		<!-- JavaScript render danh sách sản phẩm -->
	</ul>

	<!-- Pagination -->
	<nav>
		<ul class="pagination mt-4" id="pagination">
			<!-- JavaScript render phân trang -->
		</ul>
	</nav>

	<!-- Modal Thêm/Sửa sản phẩm -->
	<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<form id="productForm" enctype="multipart/form-data">
					<div class="modal-header">
						<h5 class="modal-title" id="productModalLabel">Thêm/Sửa sản phẩm</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body px-4">
						<div class="row g-4">
							<!-- Image -->
							<div class="col-md-4 border-end pe-4">
								<label for="productImages" class="form-label">Images:</label>
								<input type="file" class="form-control" id="productImages" name="images" accept="image/*"
									multiple>
								<div id="imagePreview" class="mt-3">
									<!-- Preview images here -->
								</div>
							</div>

							<!-- Product Info -->
							<div class="col-md-8 ps-4">
								<div class="mb-3">
									<label for="sku" class="form-label">SKU<span class="text-danger">(*)</span>:
									</label>
									<input type="text" class="form-control" id="sku" name="sku">
								</div>
								<div class="mb-3">
									<label for="name" class="form-label">Name<span class="text-danger">(*)</span>:
									</label>
									<input type="text" class="form-control" id="name" name="name">
								</div>
								<div class="row">
									<div class="col-md-6 mb-3">
										<label for="brandId" class="form-label">Brand:</label>
										<select class="form-select" id="brandId" name="brandId"></select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="typeId" class="form-label">Type:</label>
										<select class="form-select" id="typeId" name="typeId"></select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="caseMaterialId" class="form-label">Case Material:</label>
										<select class="form-select" id="caseMaterialId" name="caseMaterialId"></select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="strapMaterialId" class="form-label">Strap Material:</label>
										<select class="form-select" id="strapMaterialId" name="strapMaterialId"></select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="glassMaterialId" class="form-label">Glass Material:</label>
										<select class="form-select" id="glassMaterialId" name="glassMaterialId"></select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="categoryId" class="form-label">Category:</label>
										<select class="form-select" id="categoryId" name="categoryId"></select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="status" class="form-label">Status:</label>
										<select class="form-select" id="status" name="status"></select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="origin" class="form-label">Origin:</label>
										<input type="text" class="form-control" id="origin" name="origin">
									</div>
									<div class="col-md-4 mb-3">
										<label for="condition" class="form-label">Condition:</label>
										<select class="form-select" id="condition" name="condition"></select>
									</div>
									<div class="col-md-4 mb-3">
										<label for="warrantyPeriod" class="form-label">Warranty:</label>
										<input type="text" class="form-control" id="warrantyPeriod" name="warrantyPeriod">
									</div>
									<div class="col-md-4 mb-3">
										<label for="price" class="form-label">Price:</label>
										<input type="number" step="0.01" class="form-control" id="price" name="price">
									</div>
									<div class="col-md-6 mb-3">
										<label for="gender" class="form-label">Gender:</label>
										<select class="form-select" id="gender" name="gender"></select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="segment" class="form-label">Segment:</label>
										<select class="form-select" id="segment" name="segment"></select>
									</div>
									<div class="mb-3">
										<label for="description" class="form-label">Description:</label>
										<textarea class="form-control" id="description" name="description" rows="4"
											placeholder="Enter product description..."></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer bg-white">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						<button type="submit" class="btn btn-success">Submit</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Modal Delete -->
	<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Xác nhận xóa</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">Bạn có chắc chắn muốn xóa sản phẩm này không?</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
					<button type="button" id="confirmDeleteBtn" class="btn btn-danger">Xóa</button>
				</div>
			</div>
		</div>
	</div>
	<div class="modal fade" id="productDetailModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Chi tiết sản phẩm</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body" id="productDetailContent">
					<!-- Nội dung chi tiết sẽ được render ở đây -->
				</div>
			</div>
		</div>
	</div>
	<!-- Image Viewer Modal -->
	<div class="modal fade" id="imageViewerModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-lg modal-dialog-centered">
			<div class="modal-content p-3">
				<div class="modal-header">
					<h5 class="modal-title">Xem ảnh sản phẩm</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body text-center">
					<img id="mainProductImage" src="" style="max-width: 100%; max-height: 400px; object-fit: contain;"
						class="mb-3">
					<div class="d-flex justify-content-center align-items-center gap-2">
						<button class="btn btn-outline-secondary btn-sm" onclick="changeImage(-1)">&#8592;</button>
						<div id="productThumbnails" class="d-flex gap-2 overflow-auto"></div>
						<button class="btn btn-outline-secondary btn-sm" onclick="changeImage(1)">&#8594;</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Modal biến thể -->
	<div class="modal fade" id="variantsModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Biến thể sản phẩm: <span id="variantsProductName"></span></h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<table class="table table-bordered">
						<thead>
							<tr><th>SKU</th><th>Tên</th><th>Màu</th><th>Dây</th><th>Size</th><th>Giá</th><th>Trạng thái</th><th>Tồn / Giữ / Bán được</th><th></th></tr>
						</thead>
						<tbody id="variantsBody"></tbody>
					</table>
					<h6 class="mt-4" id="variantFormTitle">Thêm biến thể</h6>
					<form id="variantForm" class="row g-2">
						<input type="hidden" id="variantId">
						<div class="col-md-3"><label class="form-label">SKU</label><input class="form-control" id="variantSku" required></div>
						<div class="col-md-3"><label class="form-label">Tên biến thể</label><input class="form-control" id="variantName" required></div>
						<div class="col-md-2"><label class="form-label">Màu</label><input class="form-control" id="variantColor"></div>
						<div class="col-md-2"><label class="form-label">Dây</label><input class="form-control" id="variantStrap"></div>
						<div class="col-md-2"><label class="form-label">Size mặt</label><input class="form-control" id="variantSize"></div>
						<div class="col-md-3"><label class="form-label">Giá</label><input type="number" step="0.01" class="form-control" id="variantPrice" required></div>
						<div class="col-md-3"><label class="form-label">Trạng thái</label><select class="form-select" id="variantStatus"></select></div>
						<div class="col-md-3" id="variantInitialWrap"><label class="form-label">Tồn ban đầu</label><input type="number" min="0" class="form-control" id="variantInitialQty" value="0"></div>
						<div class="col-md-3"><label class="form-label">Ngưỡng cảnh báo tồn thấp</label><input type="number" min="0" class="form-control" id="variantThreshold" value="5"></div>
						<div class="col-12"><label class="form-label">Ảnh riêng của biến thể (tick ảnh của sản phẩm)</label><div id="variantImages" class="d-flex flex-wrap gap-2"></div></div>
						<div class="col-12 text-end">
							<button type="button" class="btn btn-secondary" onclick="resetVariantForm()">Làm mới</button>
							<button type="submit" class="btn btn-success">Lưu biến thể</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Toast -->
	<div class="fixed top-4 right-4 z-[1080]">
		<div id="errorToast" class="toast text-bg-danger" role="alert">
			<div class="flex">
				<div class="toast-body"></div>
				<button type="button" class="btn-close !text-white me-2 m-auto" data-bs-dismiss="toast"></button>
			</div>
		</div>
	</div>

	<!-- Optional image overlay -->
	<div id="imageOverlay" class="overlay" style="display: none;">
		<img id="overlayImage" src="" alt="Xem ảnh sản phẩm" />
	</div>

	<!-- Scripts -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="/js/product.js"></script>
	<script src="/js/product-variants.js"></script>
</div>
</html>
