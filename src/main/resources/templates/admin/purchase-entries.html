<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: adminLayout}">
<div th:fragment="content">
	<h1 class="font-heading text-2xl text-charcoal mb-6">Quản lý Phiếu nhập</h1>

	<!-- Search + Filter Form -->
	<form id="searchForm" th:action="@{/admin/purchases/api/search}" method="get" class="row g-2 items-end mb-6">

		<!-- Tìm tên sản phẩm -->
		<div class="col-md">
			<label class="form-label">Tên sản phẩm</label>
			<input type="text" id="productName" name="productName" th:value="${param.productName}" class="form-control"
				placeholder="Nhập tên sản phẩm..." />
		</div>

		<!-- Nút mở bộ lọc -->
		<div class="col-auto">
			<button type="button" class="btn btn-outline-secondary" data-bs-toggle="offcanvas"
				data-bs-target="#filterDrawer" aria-controls="filterDrawer">
				<i class="bi bi-funnel me-1"></i> Bộ lọc
			</button>
		</div>

		<!-- Nút Tìm kiếm -->
		<div class="col-auto">
			<button type="submit" class="btn btn-primary">
				<i class="bi bi-search me-1"></i> Tìm kiếm
			</button>
		</div>
	</form>

	<!-- Bộ lọc nâng cao (Offcanvas) -->
	<div class="offcanvas offcanvas-end" tabindex="-1" id="filterDrawer" aria-labelledby="filterDrawerLabel">
		<div class="offcanvas-header">
			<h5 class="offcanvas-title" id="filterDrawerLabel">Bộ lọc nâng cao</h5>
			<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
		</div>
		<div class="offcanvas-body">
			<div class="row g-3">
				<div class="col-6">
					<label for="fromDate" class="form-label">Từ ngày</label>
					<input type="date" id="fromDate" name="fromDate"
						th:value="${#dates.format(param.fromDate,'yyyy-MM-dd')}" form="searchForm" class="form-control" />
				</div>
				<div class="col-6">
					<label for="toDate" class="form-label">Đến ngày</label>
					<input type="date" id="toDate" name="toDate" th:value="${#dates.format(param.toDate,'yyyy-MM-dd')}"
						form="searchForm" class="form-control" />
				</div>
				<div class="col-6">
					<label for="minPrice" class="form-label">Giá tối thiểu</label>
					<input type="number" id="minPrice" name="minPrice" th:value="${param.minPrice}" form="searchForm"
						step="0.01" class="form-control" />
				</div>
				<div class="col-6">
					<label for="maxPrice" class="form-label">Giá tối đa</label>
					<input type="number" id="maxPrice" name="maxPrice" th:value="${param.maxPrice}" form="searchForm"
						step="0.01" class="form-control" />
				</div>
			</div>
		</div>
	</div>

	<!-- Danh sách kết quả -->
	<ul class="list-group mb-3" id="entryList">
		<!-- JavaScript sẽ render danh sách -->
	</ul>
	<div id="totalEntryCount" class="text-right text-charcoal-muted text-sm"></div>

	<!-- Phân trang và nút thêm -->
	<div class="d-flex justify-content-between align-items-center mt-4">
		<button class="btn btn-success" onclick="openAddBrandModal()">
			<i class="bi bi-plus-circle me-1"></i> Thêm thương hiệu
		</button>
		<nav>
			<ul class="pagination mb-0" id="pagination">
				<!-- JavaScript sẽ render phân trang -->
			</ul>
		</nav>
	</div>
	<!-- Modal Thêm / Sửa Phiếu Nhập -->
	<div class="modal fade" id="purchaseEntryModal" tabindex="-1" aria-labelledby="purchaseEntryModalLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<form id="purchaseEntryForm">
					<div class="modal-header">
						<h5 class="modal-title" id="purchaseEntryModalLabel">Thêm / Sửa Phiếu Nhập</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
					</div>
					<div class="modal-body row g-3">
						<input type="hidden" id="entryId">

						<div class="col-md-6">
							<label for="productSearch" class="form-label">Sản phẩm</label>
							<input type="text" id="productSearch" class="form-control" placeholder="Nhập tên sản phẩm..."
								autocomplete="off">
							<input type="hidden" id="productId">
							<!-- để lưu productId thực tế -->

							<ul class="list-group position-absolute w-100 z-3" id="productSuggestionList"
								style="max-height: 200px; overflow-y: auto; display: none;"></ul>
						</div>

						<div class="col-md-6">
							<label for="quantity" class="form-label">Số lượng</label>
							<input type="number" id="quantity" class="form-control" min="1" required>
						</div>

						<div class="col-md-6">
							<label for="importPrice" class="form-label">Giá nhập</label>
							<input type="number" id="importPrice" class="form-control" step="0.01" required>
						</div>

						<div class="col-md-6">
							<label for="importedAt" class="form-label">Ngày nhập</label>
							<input type="datetime-local" id="importedAt" class="form-control">
						</div>

						<div class="col-12">
							<label for="note" class="form-label">Ghi chú</label>
							<textarea id="note" rows="3" class="form-control"></textarea>
						</div>
					</div>
					<div class="modal-footer">
						<button type="submit" class="btn btn-primary">Lưu</button>
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
					</div>
				</form>
			</div>
		</div>
	</div>
	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="deleteConfirmLabel">Confirm deletion</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">Are you sure you want to delete the purchase entry?</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					<button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
				</div>
			</div>
		</div>
	</div>
	<div class="fixed top-4 right-4 z-[1080]">
		<div id="errorToast" class="toast text-bg-danger" role="alert" aria-live="assertive" aria-atomic="true">
			<div class="flex">
				<div class="toast-body"></div>
				<button type="button" class="btn-close !text-white me-2 m-auto" data-bs-dismiss="toast"
					aria-label="Close"></button>
			</div>
		</div>
	</div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="/js/purchase-entry.js"></script>
</div>
</html>
