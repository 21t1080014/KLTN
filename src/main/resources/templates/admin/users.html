<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin :: adminLayout}">
<div th:fragment="content">
	<h1 class="font-heading text-2xl text-charcoal mb-6">Quản lý Người dùng</h1>

	<!-- Search & Add New -->
	<div class="d-flex justify-content-between align-items-center mb-4">
		<form id="searchForm" class="d-flex w-50 gap-2">
			<input type="text" id="searchInput" class="form-control" placeholder="Tìm người dùng...">
			<button class="btn btn-outline-primary shrink-0">Search</button>
		</form>
		<button class="btn btn-success" onclick="openAddUserModal()">+ Add User</button>
	</div>

	<!-- User List -->
	<ul class="list-group mb-3" id="userList">
		<!-- JavaScript sẽ render danh sách tại đây -->
	</ul>

	<!-- Pagination -->
	<nav>
		<ul class="pagination mt-4" id="pagination">
			<!-- JavaScript sẽ render phân trang -->
		</ul>
	</nav>

	<!-- Modal thêm / sửa người dùng -->
	<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<form id="userForm" enctype="multipart/form-data">
					<div class="modal-header">
						<h5 class="modal-title" id="userModalLabel">Thêm / Sửa Người dùng</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body px-4">
						<div class="row g-4">
							<!-- Left: Image -->
							<div class="col-md-4 border-end pe-4">
								<div class="mb-3">
									<label for="profileImage" class="form-label">Ảnh đại diện:</label>
									<input type="file" class="form-control" id="profileImage" name="profileImage"
										accept="image/*">
								</div>
								<div class="mb-3">
									<img id="previewImage" src="/img/default.png" alt="Preview" class="img-fluid border border-line"
										style="height: 120px; display: none;" />
								</div>
								<div class="form-check mt-2">
									<input class="form-check-input" type="checkbox" id="isSeller" name="isSeller">
									<label class="form-check-label" for="isSeller">Là người bán?</label>
								</div>
							</div>

							<!-- Right: Info -->
							<div class="col-md-8 ps-4">
								<div class="row">
									<div class="col-md-6 mb-3">
										<label for="fullName" class="form-label">Họ và tên<span
												class="text-danger">*</span>:
										</label>
										<input type="text" class="form-control" id="fullName" name="fullName">
									</div>
									<div class="col-md-6 mb-3">
										<label for="username" class="form-label">Tên đăng nhập<span
												class="text-danger">*</span>:
										</label>
										<input type="text" class="form-control" id="username" name="username">
									</div>
									<div class="col-md-6 mb-3">
										<label for="email" class="form-label">Email<span class="text-danger">*</span>:
										</label>
										<input type="email" class="form-control" id="email" name="email">
									</div>
									<div class="col-md-6 mb-3">
										<label for="password" class="form-label">Mật khẩu:</label>
										<input type="password" class="form-control" id="password" name="password">
									</div>
									<div class="col-md-6 mb-3">
										<label for="phone" class="form-label">Số điện thoại:</label>
										<input type="text" class="form-control" id="phone" name="phone">
									</div>
									<div class="col-md-6 mb-3">
										<label for="address" class="form-label">Địa chỉ:</label>
										<input type="text" class="form-control" id="address" name="address">
									</div>
									<div class="col-md-6 mb-3">
										<label for="role" class="form-label">Vai trò:</label>
										<select class="form-select" id="role" name="role">
											<!-- JavaScript sẽ load dữ liệu -->
										</select>
									</div>
									<div class="col-md-6 mb-3">
										<label for="status" class="form-label">Trạng thái:</label>
										<select class="form-select" id="status" name="status">
											<!-- JavaScript sẽ load dữ liệu -->
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer bg-white">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
						<button type="submit" class="btn btn-success">Lưu</button>
					</div>
				</form>
			</div>
		</div>
	</div>



	<!-- Delete Confirmation Modal -->
	<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="deleteConfirmLabel">Xác nhận xóa</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">Bạn có chắc chắn muốn xóa người dùng này?</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					<button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Toast -->
	<div class="fixed top-4 right-4 z-[1080]">
		<div id="errorToast" class="toast text-bg-danger" role="alert" aria-live="assertive" aria-atomic="true">
			<div class="flex">
				<div class="toast-body"></div>
				<button type="button" class="btn-close !text-white me-2 m-auto" data-bs-dismiss="toast"
					aria-label="Close"></button>
			</div>
		</div>
	</div>

	<!-- Scripts -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="/js/user.js"></script>
</div>
</html>
