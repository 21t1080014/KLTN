<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Thông tin cá nhân</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/shop.css">
<link rel="stylesheet" href="/css/home.css">
<style>
.order {
	border: 1px solid #ccc;
	margin-bottom: 20px;
	padding: 15px;
	border-radius: 8px;
}

table {
	width: 100%;
	border-collapse: collapse;
}

th, td {
	border: 1px solid #ddd;
	padding: 8px;
	text-align: left;
}
</style>
</head>
<body>
	<div th:replace="~{layouts/navbar :: navbar}"></div>

	<div class="container py-4">
		<h2>Thông tin cá nhân</h2>

		<!-- Nav tabs -->
		<ul class="nav nav-tabs mb-4" id="accountTabs">
			<li class="nav-item"><a class="nav-link active" id="tab-orders"
				href="#">Đơn hàng</a></li>
			<li class="nav-item"><a class="nav-link" id="tab-profile"
				href="#">Hồ sơ</a></li>
			<li class="nav-item"><a class="nav-link" id="tab-vouchers"
				href="#">Voucher</a></li>
		</ul>

		<!-- Sections -->
		<div id="section-orders">
			<p id="message"></p>
			<div id="order-list"></div>
			<nav>
				<ul id="pagination" class="pagination justify-content-center mt-4"></ul>
			</nav>
		</div>

		<div id="section-profile" style="display: none;">
			<!-- Bạn tự thêm form/chi tiết hồ sơ tại đây -->
			<h4>Hồ sơ của bạn</h4>
			<div id="profile-content"></div>
		</div>

		<div id="section-vouchers" style="display: none;">
			<p id="voucher-message"></p>
			<div id="voucher-list"></div>
		</div>
	</div>
	<div th:replace="~{fragments/cart-drawer :: cartDrawer}"></div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="/js/orderCustomer.js"></script>
	<script type="module" src="/js/profileCustomer.js"></script>
	<script type="module" src="/js/voucherCustomer.js"></script>
	<script>
    // Chuyển tab và show/hide section
    function activateTab(tab) {
      // 1) Đổi màu active
      $('#accountTabs .nav-link').removeClass('active');
      $(`#tab-${tab}`).addClass('active');
      // 2) Show/Hide các section
      $('#section-orders, #section-profile, #section-vouchers').hide();
      $(`#section-${tab}`).show();
      // 3) Gọi hàm load dữ liệu nếu cần
      if (tab === 'orders') loadOrders();
      if (tab === 'profile') loadProfile();
      if (tab === 'vouchers') loadVouchers();
    }

    $(function(){
      // Gán click cho từng tab
      $('#tab-orders').click(e => { e.preventDefault(); activateTab('orders'); });
      $('#tab-profile').click(e => { e.preventDefault(); activateTab('profile'); });
      $('#tab-vouchers').click(e => { e.preventDefault(); activateTab('vouchers'); });
      // Mặc định load đơn hàng
      activateTab('orders');
    });
  </script>
</body>
</html>
